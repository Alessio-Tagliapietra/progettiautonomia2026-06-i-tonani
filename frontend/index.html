<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfol.io — Feed</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Portfol.io</a>
      <div class="d-flex align-items-center gap-3 ms-auto">
        <a href="index.html" class="nav-link active"><i class="bi bi-grid-fill"></i></a>
        <span id="nav-user" class="text-muted small"></span>
        <a id="nav-profile-btn" href="#" class="btn btn-outline-accent btn-sm d-none">
          <i class="bi bi-person-fill"></i> Profilo
        </a>
        <button id="nav-logout-btn" class="btn btn-sm btn-outline-danger d-none" onclick="handleLogout()">
          <i class="bi bi-box-arrow-right"></i>
        </button>
        <a id="nav-login-btn" href="login.html" class="btn btn-accent btn-sm">
          <i class="bi bi-person"></i> Accedi
        </a>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <div class="text-center py-4 px-2" style="border-bottom:1px solid var(--border)">
    <h2 style="color:var(--accent);font-weight:700;">Scopri i portfolio degli artisti</h2>
    <p class="text-muted mb-0">Esplora, ispirati, lascia un like.</p>
  </div>

  <!-- FEED MASONRY -->
  <div id="feed-container" class="masonry-grid">
    <div class="text-center text-muted py-5 w-100">
      <div class="spinner-border" style="color:var(--accent)"></div>
    </div>
  </div>

  <!-- MODAL DETTAGLIO POST -->
  <div class="modal fade" id="postModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body p-0 d-flex flex-column flex-md-row" style="border-radius:16px;overflow:hidden;min-height:400px;">
          <div class="flex-grow-1" style="background:#111;display:flex;align-items:center;justify-content:center;min-height:300px;">
            <img id="modal-img" src="" alt="" style="max-width:100%;max-height:70vh;object-fit:contain;"/>
          </div>
          <div style="width:100%;max-width:280px;padding:1.5rem;display:flex;flex-direction:column;gap:1rem;">
            <div>
              <a id="modal-author" href="#" style="color:var(--accent);font-weight:700;text-decoration:none;font-size:1.05rem;"></a>
              <p id="modal-desc" class="text-muted small mt-1 mb-0"></p>
            </div>
            <div class="mt-auto d-flex align-items-center justify-content-between">
              <button id="modal-like-btn" class="like-btn" onclick="modalToggleLike()">
                <i class="bi bi-heart"></i> <span id="modal-likes">0</span>
              </button>
              <span id="modal-date" class="text-muted" style="font-size:0.75rem;"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/feed.js"></script>
</body>
</html>
