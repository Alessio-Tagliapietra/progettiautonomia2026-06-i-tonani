<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfol.io — Accedi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="brand">Portfol.io</div>
      <div class="subtitle">Il tuo spazio creativo</div>

      <!-- TABS -->
      <ul class="nav auth-tabs justify-content-center mb-4" id="authTabs">
        <li class="nav-item">
          <button class="nav-link active" onclick="showTab('login')">Accedi</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" onclick="showTab('register')">Registrati</button>
        </li>
      </ul>

      <!-- LOGIN FORM -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label class="form-label">Nickname</label>
          <input type="text" class="form-control" id="login-nick" placeholder="il_tuo_nick" required/>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="input-group">
            <input type="password" class="form-control" id="login-password" placeholder="••••••••" required/>
            <button type="button" class="btn btn-outline-secondary" onclick="togglePwd('login-password')">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <div id="login-error" class="text-danger small mb-2 d-none"></div>
        <button type="submit" class="btn btn-accent w-100 mt-1">Accedi</button>
      </form>

      <!-- REGISTER FORM -->
      <form id="register-form" class="d-none" onsubmit="handleRegister(event)">
        <div class="mb-3">
          <label class="form-label">Nickname</label>
          <input type="text" class="form-control" id="reg-nick" placeholder="il_tuo_nick" maxlength="20" required/>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="reg-email" placeholder="email@esempio.it" required/>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="input-group">
            <input type="password" class="form-control" id="reg-password" placeholder="min. 8 caratteri" minlength="8" required/>
            <button type="button" class="btn btn-outline-secondary" onclick="togglePwd('reg-password')">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <div id="reg-error" class="text-danger small mb-2 d-none"></div>
        <div id="reg-success" class="text-success small mb-2 d-none"></div>
        <button type="submit" class="btn btn-accent w-100 mt-1">Registrati</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
