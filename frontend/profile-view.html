<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfol.io — Profilo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
</head>
<body>

  <nav class="navbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Portfol.io</a>
      <div class="d-flex gap-3 ms-auto">
        <a href="index.html" class="nav-link"><i class="bi bi-arrow-left"></i> Torna al feed</a>
      </div>
    </div>
  </nav>

  <div class="profile-header text-center">
    <div class="avatar-circle mx-auto mb-3" id="avatar-circle">?</div>
    <h2 class="profile-nick" id="profile-nick">Caricamento...</h2>
    <div class="d-flex justify-content-center gap-4 mt-3">
      <div class="profile-stat">
        <div class="number" id="stat-posts">0</div>
        <div class="label">Post</div>
      </div>
      <div class="profile-stat">
        <div class="number" id="stat-likes">0</div>
        <div class="label">Like totali</div>
      </div>
    </div>
  </div>

  <div id="view-posts" class="masonry-grid"></div>

  <!-- MODAL POST -->
  <div class="modal fade" id="postModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body p-0 d-flex flex-column flex-md-row" style="border-radius:16px;overflow:hidden;min-height:400px;">
          <div class="flex-grow-1" style="background:#111;display:flex;align-items:center;justify-content:center;">
            <img id="modal-img" src="" style="max-width:100%;max-height:70vh;object-fit:contain;"/>
          </div>
          <div style="width:100%;max-width:280px;padding:1.5rem;display:flex;flex-direction:column;gap:1rem;">
            <p id="modal-desc" class="text-muted small mb-0"></p>
            <div class="mt-auto d-flex align-items-center justify-content-between">
              <button id="modal-like-btn" class="like-btn" onclick="modalToggleLike()">
                <i class="bi bi-heart"></i> <span id="modal-likes">0</span>
              </button>
              <span id="modal-date" class="text-muted" style="font-size:0.75rem;"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/profile-view.js"></script>
</body>
</html>
