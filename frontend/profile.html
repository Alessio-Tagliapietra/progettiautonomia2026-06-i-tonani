<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfol.io — Il tuo profilo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Portfol.io</a>
      <div class="d-flex gap-3 ms-auto align-items-center">
        <a href="index.html" class="nav-link"><i class="bi bi-grid"></i> Feed</a>
        <button class="btn btn-sm btn-outline-danger" onclick="handleLogout()">
          <i class="bi bi-box-arrow-right"></i> Esci
        </button>
      </div>
    </div>
  </nav>

  <!-- HEADER PROFILO -->
  <div class="profile-header text-center">
    <div class="avatar-circle mx-auto mb-3" id="avatar-circle">?</div>
    <h2 class="profile-nick" id="profile-nick">Caricamento...</h2>
    <p class="text-muted small" id="profile-email"></p>
    <div class="d-flex justify-content-center gap-4 mt-3">
      <div class="profile-stat">
        <div class="number" id="stat-posts">0</div>
        <div class="label">Post</div>
      </div>
      <div class="profile-stat">
        <div class="number" id="stat-likes">0</div>
        <div class="label">Like totali</div>
      </div>
    </div>
    <button class="btn btn-accent mt-4" data-bs-toggle="modal" data-bs-target="#uploadModal">
      <i class="bi bi-plus-lg"></i> Carica opera
    </button>
  </div>

  <!-- GRIGLIA POST -->
  <div id="my-posts" class="masonry-grid"></div>

  <!-- UPLOAD MODAL -->
  <div class="modal fade" id="uploadModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Carica nuova opera</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()">
            <i class="bi bi-cloud-arrow-up mb-2 d-block"></i>
            <p class="text-muted mb-0">Clicca o trascina un'immagine qui</p>
            <small class="text-muted">JPG, PNG, WebP — max 16MB</small>
          </div>
          <input type="file" id="file-input" accept="image/*" class="d-none" onchange="previewImage(this)"/>
          <img id="img-preview" src="" alt="" class="w-100 mt-3 rounded d-none" style="max-height:300px;object-fit:contain;"/>
          <div class="mt-3">
            <label class="form-label">Descrizione (opzionale)</label>
            <textarea class="form-control" id="upload-desc" rows="3" maxlength="256" placeholder="Descrivi la tua opera..."></textarea>
          </div>
          <div id="upload-error" class="text-danger small mt-2 d-none"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Annulla</button>
          <button class="btn btn-accent" onclick="submitUpload()">
            <i class="bi bi-upload"></i> Pubblica
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- DELETE CONFIRM MODAL -->
  <div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content text-center p-3">
        <p class="mb-3">Eliminare questo post?</p>
        <div class="d-flex gap-2 justify-content-center">
          <button class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Annulla</button>
          <button class="btn btn-danger btn-sm" onclick="confirmDelete()">Elimina</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
